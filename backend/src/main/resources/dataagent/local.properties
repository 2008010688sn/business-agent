#####################################################################################
# ⚠️ 本文件不参与 Spring 运行时加载，改它不会产生任何运行时效果。
#
# 它是配置项的**说明与推荐值清单**，不是生效配置。原因：
#   1. 运行时加载 classpath:config/*.yaml（见 application.yml 的 spring.config.import）；
#   2. 本文件位于 classpath:/dataagent/，而 Spring Boot 默认只扫描
#      classpath:/、classpath:/config/、file:./、file:./config/；
#   3. 全模块无 @PropertySource / EnvironmentPostProcessor / additional-location。
# 反证：orchestration.executor.* 在 Java 侧无可用默认值（corePoolSize=0、keepAlive=null），
# DataAgentConfiguration:297-301 会因此抛 IllegalStateException 且该 Bean 非懒加载——
# 服务能启动，就说明这些键来自 config/agent.yaml 而不是本文件。
#
# 因此本文件有两类读者需要区分的信息：
#   • 「推荐值」= 下方每个键的赋值，即我们希望 Nacos 上配成什么；
#   • 「Java 兜底」= 键在 Nacos 上缺失时真正生效的值，写在注释里标注为「Java 兜底: X」。
# 只有标注了「Java 兜底」的键，两者才不一致——不一致本身不一定是缺陷：
# 推荐值面向正常运行，兜底值面向配置缺失，后者应当更保守。
#
# 维护约定：改这里等于改文档。要改运行时行为请改 config/agent.yaml；
# 要改「键缺失时的行为」请改对应 Java 默认值（DataAgentProperties 等）。
#####################################################################################

# AI 服务本地启动端口；仅影响本地 DataAgent 服务监听端口，默认 10108。
# 注意：standalone 端口来自 config/cloud.yaml 的 server.port，本行不生效。
server.port=10108
# PostgreSQL 默认 schema；本地初始化 SQL 与运行时表访问默认使用 v4_ai。
# ⚠️ 死配置：全仓库无任何 ${pg.schema} 占位符引用，SQL 脚本里 v4_ai 全部硬编码。保留仅作说明。
pg.schema=v4_ai

# 默认大模型供应商编码；private 表示优先使用私有 OpenAI 兼容服务。
# Java 兜底: openai（AiModelProperties.java:24）。键缺失且 providers 为空时 AgentModelFactory:133
# 抛 IllegalArgumentException「未配置的AI供应商: openai」。仅影响遗留 agent(LangChain4j) 包，dataagent 包零引用。
ai.default-provider=private
# 是否启用千问供应商；本地可按需开启，关闭后不会注册 qwen 默认模型。
ai.providers.qwen.enabled=true
# 千问 API Key；敏感配置，建议通过 QWEN_API_KEY 环境变量注入，默认空值。
ai.providers.qwen.api-key=${QWEN_API_KEY:}
# 千问默认模型名称；未单独指定模型时使用 qwen-plus。
ai.providers.qwen.default-model=qwen-plus
# 是否启用私有模型供应商；本地默认启用，用于私有 OpenAI 兼容模型。
ai.providers.private.enabled=true
# 私有模型 API Key；敏感配置，建议通过 PRIVATE_AI_API_KEY 环境变量注入，默认空值。
ai.providers.private.api-key=${PRIVATE_AI_API_KEY:}
# 私有模型 OpenAI 兼容接口地址；本地调试使用，生产应由环境或配置中心覆盖。
ai.providers.private.base-url=http://101.132.112.31/v1
# 私有供应商默认模型名称；未单独指定模型时使用该模型。
ai.providers.private.default-model=gemini-3-pro
# 向量库实现类型；默认 pgvector，可通过 DATA_AGENT_VECTORSTORE_TYPE 切换为 elasticsearch 或 simple。
# simple 是进程内内存索引 + 本地 JSON 落盘，多副本部署时各副本索引互不可见，只能显式声明后用于本地开发，不作为缺省兜底。
spring.ai.vectorstore.type=${DATA_AGENT_VECTORSTORE_TYPE:pgvector}
# DataAgent 敏感配置加密总开关，默认开启。开启后 datasource.password、model_config.api_key、model_config.proxy_password 写入库时保存为 enc:gcm: 密文；开启而未配置 crypto.key 时启动直接失败，本地开发需显式设置 DATA_AGENT_CRYPTO_ENABLED=false 才能关闭。
spring.ai.agent.crypto.enabled=${DATA_AGENT_CRYPTO_ENABLED:true}
# DataAgent 敏感配置 AES-GCM 主密钥，需为 Base64 编码的 16/24/32 字节 AES key；开启加密时必填，建议只通过环境变量注入。
spring.ai.agent.crypto.key=${DATA_AGENT_CRYPTO_KEY:}
# DataAgent 敏感配置旧密钥，仅用于密钥轮换期间兼容解密历史密文；确认历史数据已用新 key 重写后应清空。
spring.ai.agent.crypto.old-key=${DATA_AGENT_CRYPTO_OLD_KEY:}
# DataAgent 敏感配置一次性迁移开关。开启时启动后扫描历史明文并加密，需同时开启 crypto.enabled；迁移完成后应改回 false，避免每次启动重复扫描。
spring.ai.agent.crypto.migration.enabled=${DATA_AGENT_CRYPTO_MIGRATION_ENABLED:false}
# 表级向量检索返回条数上限；用于表名/字段粗召回，单位为条。
spring.ai.agent.vector-store.table-topk-limit=10
# 表级向量检索相似度阈值；低于 0.2 的候选会被过滤。
spring.ai.agent.vector-store.table-similarity-threshold=0.2
# 默认知识检索返回条数上限；用于未单独配置场景，单位为条。
spring.ai.agent.vector-store.default-topk-limit=8
# 默认知识检索相似度阈值；低于 0.4 的候选会被过滤。
spring.ai.agent.vector-store.default-similarity-threshold=0.4
# LLM 服务调用模式；stream 表示默认使用流式输出链路。
spring.ai.agent.llm-service-type=stream
# 代码执行器类型；默认 docker（容器隔离），可通过 DATA_AGENT_CODE_POOL_EXECUTOR 切换为 ai_simulation 等实现。
spring.ai.agent.code-executor.code-pool-executor=${DATA_AGENT_CODE_POOL_EXECUTOR:docker}
# 是否允许无沙箱的 local 执行器；local 会以本服务账号身份直接在宿主机运行模型生成的代码，未显式置 true 时启动直接失败。
spring.ai.agent.code-executor.allow-unsafe-local-execution=${DATA_AGENT_ALLOW_UNSAFE_LOCAL_EXECUTION:false}
# Python 代码执行最大重试次数；单位为次，避免临时执行失败直接中断。
spring.ai.agent.code-executor.python-max-tries-count=5
# 单次聊天最多允许上传的图片数量；单位为张。
spring.ai.agent.chat-attachment.max-image-count=9
# 发送给多模态模型的最大图片数量；单位为张，超过部分仅作为附件保留。
spring.ai.agent.chat-attachment.max-model-image-count=6
# 单张聊天图片最大大小；单位为字节，当前为 5MB。
spring.ai.agent.chat-attachment.max-image-size=5242880
# 单次聊天附件总大小上限；单位为字节，当前为 20MB。
spring.ai.agent.chat-attachment.max-total-size=20971520
# 聊天附件下载超时时间；单位为毫秒，超时后跳过附件内容读取。
spring.ai.agent.chat-attachment.download-timeout-ms=5000
# 聊天图片附件允许的 MIME 类型；逗号分隔，避免非图片内容进入多模态链路。
spring.ai.agent.chat-attachment.allowed-content-types=image/png,image/jpeg,image/webp
# 扫描件是否按页渲染给已有视觉模型（不是独立 OCR 产品）；false 时扫描件明确失败。
spring.ai.agent.multimodal.ocr-enabled=true
# 扫描件/关键图最多保留页数；单位为页，与 pdf-max-pages-in-context 取较小值。
spring.ai.agent.multimodal.pdf-max-kept-charts=5
# Suite 文件下载大小上限；单位为字节，当前为 50MB。
spring.ai.agent.suite-file.max-download-size=52428800
# Suite 文件下载超时时间；单位为毫秒，超时后终止本次读取。
spring.ai.agent.suite-file.download-timeout-ms=5000
# 本地技能包目录；相对服务工作目录解析，用于 Agent Skill 文件加载。
# Java 兜底: ./agent-skills（AgentSkillProperties.java:32）——目录名与此处不同。
# 键缺失时会从另一个目录静默加载（目录不存在即空技能集，不报错）。待确认线上实际用哪个名字后统一。
spring.ai.agent.skills.local-path=./dataAgent-skills
# SQL 生成与修正最大重试次数；单位为次，用于 DataAgent SQL 自修复链路。
spring.ai.agent.max-sql-retry-count=10
# ── 下列权限码 Java 兜底均为 null ──
# 键缺失时 DataAgentThinkingPermissionService:113-115 的 canView 返回 false，属失败关闭（安全方向正确）。
# 副作用是非管理员会静默看不到思考过程/答案来源/调用链，排查时容易误判为功能缺失。
# 思考过程查看权限码；默认映射 IAM 按钮权限，可通过 DATA_AGENT_THINKING_PERMISSION 覆盖。
spring.ai.agent.security.thinking-permission=${DATA_AGENT_THINKING_PERMISSION:dataagent:thinking:view}
# 答案来源查看权限码；默认映射 IAM 按钮权限，可通过 DATA_AGENT_ANSWER_SOURCE_PERMISSION 覆盖。
spring.ai.agent.security.answer-source-permission=${DATA_AGENT_ANSWER_SOURCE_PERMISSION:dataagent:answer-source:view}
# 调用链查看权限码；默认映射 IAM 按钮权限，可通过 DATA_AGENT_CALL_CHAIN_PERMISSION 覆盖。
spring.ai.agent.security.call-chain-permission=${DATA_AGENT_CALL_CHAIN_PERMISSION:dataagent:call-chain:view}
# Token 用量查看权限码；默认映射 IAM 按钮权限，可通过 DATA_AGENT_USAGE_VIEW_PERMISSION 覆盖。
spring.ai.agent.security.usage-view-permission=${DATA_AGENT_USAGE_VIEW_PERMISSION:data-agent:usage:view}
# Token 限额策略管理权限码；默认映射 IAM 按钮权限，可通过 DATA_AGENT_USAGE_MANAGE_PERMISSION 覆盖。
spring.ai.agent.security.usage-manage-permission=${DATA_AGENT_USAGE_MANAGE_PERMISSION:data-agent:usage:manage}
# 是否启用 Langfuse 观测上报；本地默认关闭，生产按观测平台接入情况开启。
# 曾有缺陷：LangfuseService:67 读的是 ${langfuse.enabled:true} 这个**不存在的键**，
# 导致本项无论配成什么都拦不住它，Langfuse 恒为开启。已修正为读取本键，默认 false。
spring.ai.agent.langfuse.enabled=${LANGFUSE_ENABLED:false}
# Langfuse 服务地址；启用 Langfuse 时必填，默认空值。
spring.ai.agent.langfuse.host=${LANGFUSE_HOST:}
# Langfuse public key；敏感配置，建议通过环境变量注入。
spring.ai.agent.langfuse.public-key=${LANGFUSE_PUBLIC_KEY:}
# Langfuse secret key；敏感配置，必须通过环境变量或安全配置注入。
spring.ai.agent.langfuse.secret-key=${LANGFUSE_SECRET_KEY:}
# AgentScope 观测总开关；默认关闭，开启后记录运行时观测数据。
spring.ai.agent.agentscope.observability.enabled=${AGENTSCOPE_OBSERVABILITY_ENABLED:false}
# AgentScope 是否复用 Langfuse tracer；开启观测且接入 Langfuse 时默认复用。
spring.ai.agent.agentscope.observability.use-langfuse-tracer=${AGENTSCOPE_OBSERVABILITY_USE_LANGFUSE_TRACER:true}
# 是否启用 Elasticsearch 健康检查；本地默认关闭，避免未部署 ES 时健康检查失败。
management.health.elasticsearch.enabled=${DATA_AGENT_ELASTICSEARCH_HEALTH_ENABLED:false}
# 是否启用当前会话自动上下文压缩；关闭后运行时继续使用原 InMemoryMemory。
# Java 兜底: true（DataAgentProperties.java:398）——与此处相反。键缺失时自动压缩会默认开启，
# 而压缩本身要调模型做摘要，等于静默产生额外 LLM 成本。建议把 Java 默认改为 false，待确认。
spring.ai.agent.memory.auto-context.enabled=false
# 是否启用接口手动上下文压缩；可与自动压缩独立开关。
spring.ai.agent.memory.auto-context.manual-enabled=true
# 当上下文使用比例达到该阈值时触发压缩；0.7 表示达到 70% 后开始压缩。
spring.ai.agent.memory.auto-context.token-ratio=0.7
# 给系统提示词、工具调用、长期记忆和运行时结构预留的 token 数。
spring.ai.agent.memory.auto-context.reserve-tokens=2000
# 消息数达到该阈值时，即使 token 估算未超阈值，也允许触发压缩。
spring.ai.agent.memory.auto-context.msg-threshold=60
# 始终保留最近 N 条 AgentScope 消息，不参与历史摘要压缩。
spring.ai.agent.memory.auto-context.last-keep=30
# 单条工具结果或消息超过该字符数时，优先摘要化或转为预览。
spring.ai.agent.memory.auto-context.large-payload-threshold=5000
# 大 payload 被摘要后保留的预览字符数。
spring.ai.agent.memory.auto-context.offload-single-preview=200
# 连续工具消息达到该数量时优先合并压缩。
spring.ai.agent.memory.auto-context.min-consecutive-tool-messages=4
# 低于该 token 规模不触发压缩，避免小会话频繁摘要。
spring.ai.agent.memory.auto-context.min-compression-token-threshold=3000
# 当前轮可压缩内容的目标压缩比例；0.3 表示压缩到原来的 30% 左右。
spring.ai.agent.memory.auto-context.current-round-compression-ratio=0.3
# Agent 单轮主执行链路的全局默认总预算；单 Agent 的 runtime_timeout_seconds 可覆盖该值。文件关联分析默认 180 秒。
spring.ai.agent.runtime.total-timeout=180s
# 单次模型调用的最长等待时间；实际值不会超过剩余总预算扣除收尾缓冲后的时间，默认 45 秒。
spring.ai.agent.runtime.model-timeout=45s
# 单次工具执行的最长等待时间；工具默认不自动重试，实际值受剩余总预算约束，默认 30 秒。
spring.ai.agent.runtime.tool-timeout=30s
# 为答案落账和 SSE 结束事件预留的时间；预算不足时不再启动新的模型或工具调用，默认 2 秒。
spring.ai.agent.runtime.finish-buffer=2s
# 模型专用 HTTP 客户端的建连超时；不影响文件、向量化等通用 HTTP 客户端，默认 5 秒。
spring.ai.agent.runtime.model-http-connect-timeout=5s
# ── 路由三项超时：推荐值与 Java 兜底差距很大，且 Java 侧那组是被测试钉住的刻意取值 ──
# RouteProfileServiceImplTest:355-356 断言了 1800/1100，说明兜底值是有意选定而非疏漏。
# 两组值该如何收敛属产品决策（在线路由要多快 vs 召回要多准），未擅自改动，详见 PRD。
# 混合路由在线总预算；同时受请求剩余 deadline 限制，取两者较小值。
# Java 兜底: 1800ms（DataAgentProperties.java:207）
spring.ai.agent.runtime.routing.total-timeout=5000ms
# 路由模型在线调用上限；不得超过总预算扣除路由收尾缓冲后的时间。
# Java 兜底: 1100ms（DataAgentProperties.java:210）
spring.ai.agent.runtime.routing.model-timeout=3000ms
# 路由向量召回调用上限；不得超过总预算扣除路由收尾缓冲后的时间。
# Java 兜底: 250ms（DataAgentProperties.java:213）——250ms 内向量召回大概率超时，
# 键一旦从 Nacos 缺失，路由的向量召回会静默退化为「几乎总是超时」，这是本组里最值得警惕的一项。
spring.ai.agent.runtime.routing.vector-timeout=1500ms
# 剩余预算低于该值时不再启动路由模型。
spring.ai.agent.runtime.routing.model-min-start=400ms
# 为路由决策组装与返回预留的内部缓冲。
spring.ai.agent.runtime.routing.finish-buffer=150ms
# 以下探测预算只用于管理端能力探测，不参与在线路由 deadline 计算。
spring.ai.agent.runtime.routing.model-probe-timeout=30s
spring.ai.agent.runtime.routing.model-probe-connect-timeout=3s
spring.ai.agent.runtime.routing.embedding-probe-timeout=30s
# 路由模型优先使用 submit_route_plan Function Calling；滚动发布完成并确认所有节点已升级后开启。
spring.ai.agent.runtime.routing.function-calling-enabled=${ROUTE_FUNCTION_CALLING_ENABLED:false}
# 单个问题中主 ReAct 推理与工具执行的最大循环轮数；平台、Agent、Skill 取最小正值。
# Java 兜底: 16。文件关联分析需要更多探表/核对轮次。Nacos 同名键需同步。
spring.ai.agent.runtime.react-max-iterations=16
# 业务 SEARCH 未指定数量时的默认结果行数。
spring.ai.agent.runtime.default-result-rows=20
# 业务 SEARCH 单次允许返回的最大结果行数，不影响元数据、字段画像和 PREVIEW_ROWS。
spring.ai.agent.runtime.max-result-rows=200
# 单次 ReAct 运行模型调用次数的全局默认上限；Agent、Skill 只能收紧。与轮次对齐。
# Java 兜底: 16。Nacos 同名键需同步。
spring.ai.agent.runtime.max-model-calls=16
# ── 下面两项此前推荐值是 0（= 不限），已改为与 Java 兜底一致的正值 ──
# 改动原因（AI-2a）：0 使 AgentRuntimeToolMetrics.java:127 与 :454 的 `> 0` 判断恒假，两道闸直接失效。
# 叠加 memory.auto-context 关闭与工具结果整串无截断回灌后，单轮只剩迭代数与墙钟两道闸，
# 而每次模型调用的 prompt 都包含此前全部工具结果原文，成本随轮数呈二次增长且无上限。
# 这是本文件中唯一出现过「推荐值比兜底值更危险」的一组，故就地改正而非仅标注。
# ⚠️ 本文件不参与运行时加载，改这里只改文档——**必须同步修改 Nacos 上的同名键**，否则线上闸仍是关的。
# 单次 ReAct 运行工具调用次数的全局默认上限；Agent、Skill 只能收紧。与轮次对齐，避免文件关联分析先撞工具墙。
spring.ai.agent.runtime.max-tool-calls=16
# 单次提问累计 token 上限（本轮所有模型调用 input+output 之和，不是整段会话寿命）；Agent、Skill 只能收紧。
# 2.0 信封使用该值。本文件不参与运行时加载，Nacos 同名键必须同步为 5000000。
spring.ai.agent.runtime.max-prompt-tokens=0
# 相同只读工具调用允许实际完成的次数；下一次相同且无新进展的调用触发循环保护，默认 2 次。
spring.ai.agent.runtime.no-progress-max-completed-identical-calls=2
# 送给报告模型的结构化结果预览行数；后端指标、表格和图表仍使用完整 SEARCH 结果。
spring.ai.agent.report.prompt-preview-rows=50
# 编排协作者执行调度模式：EVENT_DRIVEN（事件驱动 DAG 调度，单分支终态立即释放就绪下游，不等整批）
# 或 LEGACY（整批 barrier）。事件驱动依赖权威运行镜像（agent_runtime_run/step），镜像不可用时
# 自动回落整批执行，行为与 LEGACY 一致。
spring.ai.agent.orchestration.scheduler=EVENT_DRIVEN
# 新建编排策略单次最多协作者数量。
spring.ai.agent.orchestration.default-max-collaborators-per-run=3
# 新建编排策略的失败策略。
spring.ai.agent.orchestration.default-failure-strategy=continue
# 新建编排策略是否保存并展示编排轨迹。
spring.ai.agent.orchestration.default-expose-trace=true
# 新建编排策略是否启用。
spring.ai.agent.orchestration.default-enabled=true
# ── 编排线程池四项：Java 侧无可用默认值，键缺失即启动失败 ──
# DataAgentConfiguration:297-301 在 corePoolSize<1 或 keepAlive==null 时抛
# IllegalStateException「编排线程池配置无效」，且该 @Bean 非懒加载。
# 这是刻意的 fail-fast（配错不如不起），不建议补 Java 默认值把它变成静默兜底。
# 也正因如此，服务能启动本身就证明这四项来自 Nacos——这是「本文件不生效」的决定性反证。
# 编排专用线程池核心线程数。
spring.ai.agent.orchestration.executor.core-pool-size=4
# 编排专用线程池最大线程数。
spring.ai.agent.orchestration.executor.max-pool-size=8
# 编排专用线程池队列容量。
spring.ai.agent.orchestration.executor.queue-capacity=64
# 编排专用线程池非核心线程空闲回收时间。
spring.ai.agent.orchestration.executor.keep-alive=60s
# Flow 字段稀疏抽取模型的单次调用超时；支持 Duration 写法，默认 15 秒，并受请求剩余 deadline 限制；超时会尝试下一个结构化协议。
spring.ai.agent.flow.extract-timeout=15s
# Flow 字段稀疏抽取的可选输出上限（token）。0 = 不叠加 FLOW 帽，取 min(模型 max_tokens, 上下文窗口 − prompt − reserve)；
# 大于 0 时再与模型上限取较小值。thinking 模型用 1024 容易 LENGTH 丢掉已抽出的槽位，默认请保持 0。
# Java 兜底: 0。运行时改 Nacos 同名键，本文件不加载。
spring.ai.agent.flow.extract-max-tokens=0
# 平台允许的 Resolver 最大并发数；默认 4，代码硬上限 16，Skill 版本 scheduler.maxParallelResolvers 只能取更小值。
spring.ai.agent.flow.max-parallel-resolvers=4
# 单次 Flow 允许的 Resolver 最大执行波次数；默认 8，代码硬上限 32，超过后进入可重试等待状态。
spring.ai.agent.flow.max-resolver-waves=8
# 单批 Resolver 或受控 forEach 的最大条目数；默认 20，代码硬上限 100，超过时拒绝执行该批次。
spring.ai.agent.flow.max-fan-out-items=20
# Flow Resolver 专用有界线程池队列容量；默认 32，代码限制为 1 至 1024，队列满时进入可重试等待状态。
spring.ai.agent.flow.executor-queue-capacity=32
# 是否启用长期记忆能力总开关；关闭后不抽取、不召回、不注入。
spring.ai.agent.long-term-memory.enabled=true
# Agent 新建或未配置时是否默认开启长期记忆召回；建议默认关闭，由管理员显式开启。
spring.ai.agent.long-term-memory.recall-enabled-default=false
# Agent 新建或未配置时是否默认开启自动写入；建议默认关闭，避免自动沉淀无效记忆。
spring.ai.agent.long-term-memory.write-enabled-default=false
# 单次问答最多召回多少条长期记忆。
spring.ai.agent.long-term-memory.default-top-k=5
# 长期记忆召回相似度阈值，低于该阈值不注入上下文。
spring.ai.agent.long-term-memory.default-similarity-threshold=0.75
# 长期记忆最多占用的上下文 token 预算。
spring.ai.agent.long-term-memory.default-injection-token-budget=1200
# 低于该重要度的记忆默认不召回。
spring.ai.agent.long-term-memory.default-min-importance=0.5
# 候选记忆低于该置信度不落库。
spring.ai.agent.long-term-memory.min-extraction-confidence=0.7
# 是否允许自动写入历史结论类记忆；默认关闭。
spring.ai.agent.long-term-memory.auto-write-episodic-enabled=false
# 是否允许自动写入敏感业务结果；默认关闭。
spring.ai.agent.long-term-memory.auto-write-sensitive-result-enabled=false
# 自动抽取长期记忆的最大耗时；超时后放弃本次抽取，不影响主问答。
spring.ai.agent.long-term-memory.extraction-timeout-ms=30000
# 长期记忆召回检索最大耗时；超时后跳过长期记忆，不影响主问答。
spring.ai.agent.long-term-memory.recall-timeout-ms=3000
# 评估任务执行器最大并发数。
spring.ai.agent.evaluation.executor.max-concurrency=2
# 评估任务执行器队列容量。
spring.ai.agent.evaluation.executor.queue-capacity=100
# 是否允许 LLM 自动生成自进化候选。Java 兜底: false。
spring.ai.agent.optimization.auto-generate-enabled=false
# 送入生成器的失败轨迹最大字符数。Java 兜底: 2000。
spring.ai.agent.optimization.max-trace-chars=2000
# 是否开启 DataAgent 生产问答只读 Shadow（异步 DRY_RUN 镜像候选 prompt，不是线上切流）。Java 兜底: false。
spring.ai.agent.optimization.shadow-enabled=false
# Shadow 租户白名单，逗号分隔；空名单不镜像任何租户。Java 兜底: 空。
spring.ai.agent.optimization.shadow-tenant-ids=
# 是否允许模型调用 web_fetch 读公网页面。默认关。打开后仍禁止抓本系统页面。超时/体积/QPS 写死在代码里。
spring.ai.agent.web-evidence.fetch-enabled=false
# 本环境前端/网关/API 的 origin，逗号分隔。公网域名的内部站点必须配（如 https://preview.cortp.com）。RFC1918/localhost 不用配。
spring.ai.agent.web-evidence.app-origins=
